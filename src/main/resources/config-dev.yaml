# Environment: dev  (selected with -Dmule.env=dev, the default)
# Secrets are NOT stored here: ${ENTRA_CLIENT_SECRET} is resolved from an
# environment variable / system property at runtime.

http:
  port: "8081"

# --- Identity provider (Microsoft Entra ID) -----------------------------------
entra:
  host: "login.microsoftonline.com"
  tenantId: "00000000-0000-0000-0000-000000000000"   # TODO
  clientId: "11111111-1111-1111-1111-111111111111"   # TODO (app registration for this Mule app)
  clientSecret: "${ENTRA_CLIENT_SECRET}"

# --- AWS ----------------------------------------------------------------------
aws:
  region: "ap-southeast-2"                            # region of the S3 bucket
  roleArn: "arn:aws:iam::123456789012:role/mule-s3-oidc-role"   # TODO
  sessionDurationSeconds: "3600"
  # "true"  -> SHA-256 of the body is signed (safest, buffers body in memory)
  # "false" -> UNSIGNED-PAYLOAD (HTTPS only; fine for large objects)
  signPayload: "true"
  # "true" logs the SigV4 canonical request (token masked) at WARN, to compare with the
  # <CanonicalRequest> S3 returns in a SignatureDoesNotMatch error. Keep "false" normally.
  debugSigning: "false"

# --- Cloudflare (what Mule actually connects to) ---------------------------------
cloudflare:
  protocol: "HTTPS"
  host: "s3-proxy.dev.example.com"                    # TODO
  port: "443"
  # Headers Cloudflare needs to authenticate the call and to know where to forward it.
  # They are NOT part of the SigV4 signature (Cloudflare consumes them). Names are configurable;
  # a header with an empty name is not sent.
  auth:
    hostNameHeader: "cloudFlareHostName"     # value is always s3.signingHost (the host that was signed)
    clientIdHeader: "cloudFlareAccessId"
    clientId: "${CLOUDFLARE_ACCESS_ID}"
    clientSecretHeader: "cloudFlareAccessSecret"
    clientSecret: "${CLOUDFLARE_ACCESS_SECRET}"

# --- S3 (what gets signed; must equal the Host header S3 finally receives) --------
s3:
  # Virtual-hosted style:  <bucket>.s3.<region>.amazonaws.com   + pathPrefix ""
  # Path style:            s3.<region>.amazonaws.com            + pathPrefix "/<bucket>"
  signingHost: "my-bucket.s3.ap-southeast-2.amazonaws.com"   # TODO
  pathPrefix: ""
